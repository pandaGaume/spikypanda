<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Node Editor v2</title>

    <!-- IBM Plex (inspiration from HELIOS, no framework dependency) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500&display=swap" />

    <!-- nodeeditor bundle CSS (node/port/connection visuals) -->
    <link rel="stylesheet" href="../bundle/nodeeditor.css" />

    <!-- v2 sample: self-contained tokens + reset + shell -->
    <link rel="stylesheet" href="node-editor-v2.css" />
</head>
<body>
    <div class="nev2-app">
        <header class="nev2-topbar" id="nev2-toolbar">
            <a class="nev2-brand" href="#" tabindex="-1">
                <span class="nev2-brand-dot" aria-hidden="true"></span>
                <span>Node Editor</span>
                <span class="nev2-brand-sub">v2</span>
            </a>
            <span class="nev2-spacer"></span>
            <!-- toolbar buttons injected by node-editor-v2.js -->
        </header>

        <main class="nev2-body">
            <aside class="nev2-palette" id="palette">
                <div class="nev2-section-title">Palette</div>
                <div class="nev2-empty">No nodes registered</div>
            </aside>

            <section class="nev2-center">
                <!-- Tab bar swapping the central column between the
                     graph editor and the per-node documentation. The
                     docs tab content is driven by the current single
                     selection. -->
                <div class="nev2-center-tabs" id="nev2-center-tabs">
                    <button type="button" class="nev2-center-tab is-active" data-tab="graph">Graph</button>
                    <button type="button" class="nev2-center-tab" data-tab="docs">
                        <span>Docs</span>
                        <span class="nev2-center-tab-dot" aria-hidden="true"></span>
                    </button>
                </div>
                <div class="nev2-center-bodies">
                    <div class="nev2-viewer is-active" id="viewer">
                        <!-- GraphViewer mounts here -->
                    </div>
                    <div class="nev2-docs" id="docs">
                        <!-- DocsViewer mounts here -->
                    </div>
                </div>
            </section>

            <aside class="nev2-property" id="property">
                <div class="nev2-section-title">Properties</div>
                <div class="nev2-empty">Select a node</div>
            </aside>
        </main>

        <!-- Splitter between the graph area above and the dashboard
             below. Dragged vertically; drives the row sizes of .nev2-app. -->
        <div class="nev2-splitter nev2-splitter-h" id="nev2-splitter-dashboard"></div>

        <!-- Dashboard panel: GridStack lives here. Tiles for nodes that
             implement IRenderable (Viz.Plot:line and future tile types)
             are auto-added/removed as those nodes enter/leave the graph. -->
        <section class="nev2-dashboard-host" id="nev2-dashboard"></section>

        <!-- DebugConsole component mounts here; styling comes from the
             active editor skin via ne-* tokens, not from the v2 page. -->
        <footer class="nev2-console-host" id="nev2-console"></footer>
    </div>

    <!-- Cache-buster: change this string when bundles rebuild and you
         want Live Server / dev cache to fetch fresh. The browser keys
         on the full URL, so any change to the query string forces a
         re-fetch even when the path / file is unchanged. -->
    <script src="../bundle/spikypanda-core.js?v=p32"></script>
    <script src="../bundle/spikypanda-onnx.js?v=p32"></script>
    <script src="../bundle/nodeeditor.js?v=p32"></script>
    <script src="../bundle/SpkPluginGeometry.js?v=p32"></script>
    <script src="../bundle/SpkPluginLogic.js?v=p32"></script>
    <script src="../bundle/SpkPluginDsp.js?v=p32"></script>
    <script src="../bundle/SpkPluginPhysics.js?v=p32"></script>
    <script src="../bundle/SpkPluginControl.js?v=p32"></script>
    <script src="../bundle/SpkPluginChemistry.js?v=p32"></script>
    <script src="../bundle/SpkPluginViz.js?v=p32"></script>
    <script src="../bundle/SpkPluginHelios.js?v=p32"></script>
    <script type="module" src="node-editor-v2.js?v=p32"></script>
</body>
</html>
