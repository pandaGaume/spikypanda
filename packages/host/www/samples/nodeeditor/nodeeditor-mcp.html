<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SpikyPanda - MCP Agent</title>
    <link rel="stylesheet" href="nodeeditor-mcp.css" />
    <link rel="stylesheet" href="nodeeditor.css" />
</head>
<body>
    <header class="mcp-header">
        <h1>SpikyPanda &middot; MCP Agent Interface</h1>
        <a href="research-projects.html" style="color:#58a6ff;text-decoration:none;font-size:12px;padding:4px 10px;border:1px solid #30363d;border-radius:4px;">Projects &rarr;</a>
        <span class="spacer"></span>
        <div class="field">
            <label for="mcp-research-dir">Research dir</label>
            <input id="mcp-research-dir" type="text" placeholder="(loading...)" style="min-width: 280px;" />
            <button id="mcp-research-apply" type="button" class="btn-secondary">Apply</button>
        </div>
        <div class="field">
            <label for="mcp-grammar">Grammar</label>
            <select id="mcp-grammar">
                <option value="physics-fr">physics-fr</option>
                <option value="physics-en">physics-en</option>
            </select>
        </div>
        <div class="field">
            <label for="mcp-provider">Provider</label>
            <input id="mcp-provider" type="text" value="nodeeditor" />
        </div>
        <span id="mcp-status" class="mcp-status-badge disconnected">Disconnected</span>
        <button id="mcp-connect-btn" type="button">Connect</button>
    </header>

    <main class="mcp-main">
        <section class="mcp-left">
            <div class="mcp-panel">
                <div class="mcp-panel-title">Scenario</div>
                <div class="mcp-panel-body" id="panel-scenario">
                    <div class="mcp-empty">Waiting for first read.</div>
                </div>
            </div>

            <div class="mcp-panel">
                <div class="mcp-panel-title">Simulation</div>
                <div class="mcp-panel-body" id="panel-sim">
                    <div class="mcp-empty">Waiting for first read.</div>
                </div>
            </div>

            <div class="mcp-panel">
                <div class="mcp-panel-title">Measurements</div>
                <div class="mcp-panel-body" id="panel-measure">
                    <div class="mcp-empty">Waiting for first read.</div>
                </div>
            </div>
        </section>

        <section class="mcp-right">
            <div class="mcp-panel" style="flex: 1 1 auto;">
                <div class="mcp-panel-title">Agent Log</div>
                <div class="mcp-log" id="agent-log"></div>
            </div>
        </section>
    </main>

    <section class="mcp-graph" id="graph-view">
        <div class="mcp-graph-header" id="graph-toggle">▶ Graph View (click to expand for screenshots)</div>
        <div class="mcp-graph-body">
            <div id="editor-container"></div>
            <div id="ne-play-panel" class="ne-play-panel"></div>
        </div>
    </section>

    <!-- Hidden DOM required by nodeeditor.js boot. The element is needed to *
     * exist; the CSS clips it so the menu it would inject is invisible.    -->
    <div id="toolbar"></div>

    <!-- Common helpers (logging, etc.) -->
    <script src="../../js/common.js"></script>

    <!-- Node editor stack: provides window.__spk and window.__spkOps. -->
    <script src="../../bundle/nodeeditor.js"></script>
    <script src="../../bundle/onnx-editor.js"></script>
    <script src="../../bundle/spikypanda-sensors.js"></script>

    <!-- MCP bundles. Order matters:
           1. mcp-core.js     -> window.McpCore   (interfaces, runtime stubs)
           2. mcp-server.js   -> window.McpServer (McpServerBuilder, McpBehavior, ...)
           3. mcp-spikypanda.js -> window.McpSpikyPanda (adapters + behaviors) -->
    <script src="../../bundle/mcp-core.js"></script>
    <script src="../../bundle/mcp-server.js"></script>
    <script src="../../bundle/mcp-spikypanda.js"></script>

    <!-- Boots the node editor and installs window.__spk / window.__spkOps. -->
    <script type="module" src="nodeeditor.js"></script>

    <!-- MCP bootstrap, status panel updates, agent log wiring. -->
    <script type="module" src="nodeeditor-mcp.js"></script>
</body>
</html>
