<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Memory Viz</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              sans: ['Inter', 'system-ui', 'sans-serif'],
              mono: ['"JetBrains Mono"', 'ui-monospace', 'monospace'],
            },
          },
        },
      };
    </script>
    <style>
      html, body, #root { height: 100%; margin: 0; }
      body { font-family: 'Inter', system-ui, sans-serif; background: #0a0a0a; color: #e5e5e5; -webkit-font-smoothing: antialiased; }
      /* Custom scrollbar */
      ::-webkit-scrollbar { width: 10px; height: 10px; }
      ::-webkit-scrollbar-track { background: transparent; }
      ::-webkit-scrollbar-thumb { background: #262626; border-radius: 5px; }
      ::-webkit-scrollbar-thumb:hover { background: #404040; }
      /* Subtle dotted grid for arena background */
      .arena-grid {
        background-image:
          linear-gradient(to right, rgba(255,255,255,0.025) 1px, transparent 1px),
          linear-gradient(to bottom, rgba(255,255,255,0.025) 1px, transparent 1px);
      }
      .arena-grid-light {
        background-image:
          linear-gradient(to right, rgba(0,0,0,0.04) 1px, transparent 1px),
          linear-gradient(to bottom, rgba(0,0,0,0.04) 1px, transparent 1px);
      }
      /* Animate tensor rects */
      .tensor-rect {
        transition: x 220ms cubic-bezier(0.16, 1, 0.3, 1),
                    y 220ms cubic-bezier(0.16, 1, 0.3, 1),
                    width 220ms cubic-bezier(0.16, 1, 0.3, 1),
                    height 220ms cubic-bezier(0.16, 1, 0.3, 1),
                    opacity 180ms ease-out;
      }
      /* Hide spinners on number inputs */
      input[type=number]::-webkit-inner-spin-button { -webkit-appearance: none; }
      /* Drag cursor on scrubber */
      .scrubber-handle { cursor: ew-resize; }
      .scrubber-handle:hover .scrubber-grip { background: #fde047; }
      /* Selection */
      ::selection { background: rgba(253, 224, 71, 0.3); }
    </style>
    <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
    <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
    <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
    <!-- SpikypandaCore exposes the planning module (strategies + lifetimes
         + metrics). Loaded synchronously so it is available before the
         Babel-tagged scripts execute. -->
    <script src="../../bundle/spikypanda-core.js"></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="text/babel" data-presets="env,react" src="icons.jsx"></script>
    <script type="text/babel" data-presets="env,react" src="mock-data.jsx"></script>
    <script type="text/babel" data-presets="env,react" src="header.jsx"></script>
    <script type="text/babel" data-presets="env,react" src="timeline.jsx"></script>
    <script type="text/babel" data-presets="env,react" src="arena.jsx"></script>
    <script type="text/babel" data-presets="env,react" src="metrics.jsx"></script>
    <script type="text/babel" data-presets="env,react" src="memory-viz.jsx"></script>
    <script type="text/babel" data-presets="env,react">
      const root = ReactDOM.createRoot(document.getElementById('root'));
      root.render(<MemoryViz />);
    </script>
  </body>
</html>
